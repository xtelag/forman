name: forman

services:
  app:
    image: ghcr.io/xtelag/forman:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      FORMAN_DATABASE_PATH: /data/forman.sqlite
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
