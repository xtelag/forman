name: Publish OCI image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'xtelag/forman'
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/xtelag/forman
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Check release version
        id: release
        run: |
          version=$(docker run --rm -i node:24-trixie-slim \
            node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version' < package.json)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Git tag %s must match the package.json version v%s.\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64,arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish the OCI image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker buildx build --platform linux/amd64,linux/arm64 --pull \
            --output type=registry,oci-mediatypes=true \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" .
