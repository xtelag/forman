name: Scan OCI image

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Publish OCI image]
    types: [completed]

permissions:
  packages: read

jobs:
  scan:
    if: >-
      github.repository == 'xtelag/forman' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Scan the published Forman image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          registry_config="$(mktemp -d)"
          printf '%s' "$GHCR_TOKEN" | docker --config "$registry_config" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker --config "$registry_config" logout ghcr.io >/dev/null' EXIT
          docker run --rm \
            --mount "type=bind,source=$registry_config,target=/root/.docker,readonly" \
            docker.io/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --image-src remote --platform "$PLATFORM" \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            ghcr.io/xtelag/forman:latest
