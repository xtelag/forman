name: Scan OCI image

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Publish OCI image]
    types: [completed]

permissions:
  packages: read

env:
  IMAGE: ghcr.io/xtelag/forman
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  scan:
    if: >-
      github.repository == 'xtelag/forman' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.scan.outputs.tag }}
      digest: ${{ steps.scan.outputs.digest }}
      revision: ${{ steps.scan.outputs.revision }}
    steps:
      - name: Scan the published Forman image
        id: scan
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_config="$(mktemp -d)"
          cache="$(mktemp -d)"
          report="$(mktemp)"
          trap 'docker --config "$registry_config" logout ghcr.io >/dev/null; unlink "$report"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker --config "$registry_config" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          digest="$(docker --config "$registry_config" buildx imagetools inspect "$IMAGE:latest" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]

          blocking_total=0
          fixable_os_total=0
          for platform in linux/amd64 linux/arm64; do
            printf '::group::%s\n' "$platform"
            docker run --rm \
              --mount "type=bind,source=$registry_config,target=/root/.docker,readonly" \
              --mount "type=bind,source=$cache,target=/root/.cache/trivy" \
              "$TRIVY_IMAGE" \
              image --image-src remote --platform "$platform" \
              --scanners vuln --severity HIGH,CRITICAL --format json --no-progress \
              "$IMAGE@$digest" > "$report"

            docker run --rm -i "$TRIVY_IMAGE" convert --format table /dev/stdin < "$report"
            printf '::endgroup::\n'

            for severity in HIGH CRITICAL; do
              unfixed="$(jq -e --arg severity "$severity" '[.Results[].Vulnerabilities[]?
                | select(.Severity == $severity and (.FixedVersion // "") == "")] | length' "$report")"
              if (( unfixed > 0 )); then
                printf '::warning::%s %s findings without an available fixed version on %s.\n' "$unfixed" "$severity" "$platform"
              fi
            done

            blocking="$(jq -e '[.Results[].Vulnerabilities[]?
              | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | length' "$report")"
            fixable_os="$(jq -e '[.Results[] | select(.Class == "os-pkgs") | .Vulnerabilities[]?
              | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | length' "$report")"
            blocking_total=$((blocking_total + blocking))
            fixable_os_total=$((fixable_os_total + fixable_os))
            if (( blocking > 0 )); then
              printf '::error::%s fixable HIGH or CRITICAL findings on %s.\n' "$blocking" "$platform"
            fi
          done

          if [[ "$GITHUB_EVENT_NAME" == schedule ]] && (( fixable_os_total > 0 )); then
            release="$(docker --config "$registry_config" buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' | jq -er '
              [.["linux/amd64"], .["linux/arm64"] | .config.Labels
                | [."org.opencontainers.image.version", ."org.opencontainers.image.revision"]]
              | unique | select(length == 1) | .[0]
              | select(.[0] | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | select(.[1] | type == "string" and test("^[a-f0-9]{40}$"))
              | @tsv')"
            IFS=$'\t' read -r version revision <<< "$release"
            printf 'tag=v%s\ndigest=%s\nrevision=%s\n' "$version" "$digest" "$revision" >> "$GITHUB_OUTPUT"
          fi
          (( blocking_total == 0 ))

  refresh:
    needs: scan
    if: failure() && needs.scan.result == 'failure' && github.event_name == 'schedule' && needs.scan.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: ${{ needs.scan.outputs.tag }}
      expected-digest: ${{ needs.scan.outputs.digest }}
      expected-revision: ${{ needs.scan.outputs.revision }}
